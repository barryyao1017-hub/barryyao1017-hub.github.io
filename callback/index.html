<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tesla sign-in code</title>
<style>body{font-family:-apple-system,system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;background:#fff;color:#111}code{display:block;word-break:break-all;background:#f2f2f2;padding:12px;border-radius:8px;margin:12px 0}button{padding:10px 16px;font-size:16px}</style></head>
<body><h2>Tesla sign-in</h2><p id="msg">Reading code…</p><code id="code"></code><button onclick="navigator.clipboard.writeText(document.getElementById('code').textContent)">Copy code</button>
<script>
const p=new URLSearchParams(location.search);
const c=p.get('code'),e=p.get('error');
document.getElementById('msg').textContent=c?'Copy this code and paste it back to Claude (it expires in a few minutes):':'No code found. '+(e?('Error: '+e+' '+(p.get('error_description')||'')):'');
document.getElementById('code').textContent=c||'';
</script></body></html>
